name: Publish-AiLogging

permissions:
  contents: write
  id-token: write
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: 'Publish to powershell gallery'
        required: false
        default: false

jobs:
  publishToGallery:
    runs-on: windows-2022
    environment: release
    env:
      MODULE_NAME: AiLogging
      AZURE_TENANT_ID: ${{ vars.TENANTINTEGRATION_TENANTID }}
      AZURE_CLIENT_ID: ${{ vars.TENANTINTEGRATION_CLIENTID }}
      SIGNING_ENDPOINT: https://weu.codesigning.azure.net
      SIGNING_ACCOUNT: greycorbel
      SIGNING_PROFILE: greycorbel-signing

    steps:
    - uses: actions/checkout@v4

    - name: Copy License
      shell: pwsh
      run: |
        Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') -Destination (Join-Path $env:GITHUB_WORKSPACE 'Module' $env:MODULE_NAME 'LICENSE.txt') -Force

    - name: Build Module
      uses: GreyCorbel/PsModuleActions/build-module@v2
      with:
        module-name: ${{ env.MODULE_NAME }}

    - name: Log in to Azure with OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        allow-no-subscriptions: true

    - name: Sign module files with Artifact Signing
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ env.SIGNING_ENDPOINT }}
        signing-account-name: ${{ env.SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ env.SIGNING_PROFILE }}
        files-folder: ${{ github.workspace }}\Module\${{ env.MODULE_NAME }}
        files-folder-filter: ps1,ps1xml,psd1,psm1,pssc,psrc,cdxml
        files-folder-recurse: true
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256


    - name: Publish
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      shell: pwsh
      env:
        SECRET: ${{ secrets.GC_PSGALLERY_APIKEY }}
      run: |
        $modulePath = Join-Path $env:GITHUB_WORKSPACE 'Module' $env:MODULE_NAME
        Write-Host "Publishing from: $modulePath"
        try
        {
          #makes sure that mandatory PSResourceRepository.xml is created
          Get-PSResourceRepository | Out-Null
          $env:PSModulePath = $env:PSModulePath + [System.IO.Path]::PathSeparator + (Join-Path $env:GITHUB_WORKSPACE 'Module')
          "PSModulePath: $env:PSModulePath"
          Publish-PSResource -Path $modulePath -Repository PSGallery -ApiKey "$env:SECRET"
        }
        catch
        {
          Write-Host "Error: $($_.Exception)"
          throw
        }

    - name: Create Release
      id: create_release
      if: ${{ github.event_name != 'workflow_dispatch' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        draft: false
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: false
        name: Release ${{ github.ref_name }}
