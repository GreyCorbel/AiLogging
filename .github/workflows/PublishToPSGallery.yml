name: Publish-AiLogging

permissions:
  contents: write
  id-token: write
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: 'Publish to powershell gallery'
        required: false
        default: false
      runner:
        type: choice
        description: 'Runner to use'
        required: false
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest

jobs:
  publishToGallery:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment: release
    env:
      MODULE_NAME: AiLogging
      AZURE_TENANT_ID: ${{ vars.TENANTINTEGRATION_TENANTID }}
      AZURE_CLIENT_ID: ${{ vars.TENANTINTEGRATION_CLIENTID }}
      SIGNING_ENDPOINT: weu.codesigning.azure.net
      SIGNING_ACCOUNT: greycorbel
      SIGNING_PROFILE: greycorbel-signing
      JSIGN_VERSION: '7.6'

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Copy License
      shell: pwsh
      run: |
        Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') -Destination (Join-Path $env:GITHUB_WORKSPACE 'Module' $env:MODULE_NAME 'LICENSE.txt') -Force

    - name: Build Module
      uses: GreyCorbel/PsModuleActions/build-module@v2
      with:
        module-name: ${{ env.MODULE_NAME }}

    - name: Log in to Azure with OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        allow-no-subscriptions: true

    - name: Sign module files with Artifact Signing
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $jsign = Join-Path $env:RUNNER_TEMP 'jsign.jar'
        Invoke-WebRequest -Uri "https://github.com/ebourg/jsign/releases/download/$env:JSIGN_VERSION/jsign-$env:JSIGN_VERSION.jar" -OutFile $jsign

        $env:SIGNING_TOKEN = az account get-access-token --resource https://codesigning.azure.net --query accessToken --output tsv
        if($LASTEXITCODE -ne 0 -or [string]::IsNullOrEmpty($env:SIGNING_TOKEN)) { throw 'Failed to obtain access token for Artifact Signing' }
        Write-Host "::add-mask::$env:SIGNING_TOKEN"

        $files = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'Module' $env:MODULE_NAME) -File -Recurse -Include *.ps1, *.ps1xml, *.psd1, *.psm1, *.pssc, *.psrc, *.cdxml
        $fileList = Join-Path $env:RUNNER_TEMP 'files-to-sign.txt'
        $files.FullName | Set-Content -Path $fileList
        Write-Host "Signing $($files.Count) file(s):"
        $files.FullName | Write-Host

        #single invocation to sign all files to save signing API quota
        java -jar $jsign `
          --storetype TRUSTEDSIGNING `
          --keystore $env:SIGNING_ENDPOINT `
          --storepass env:SIGNING_TOKEN `
          --alias "$env:SIGNING_ACCOUNT/$env:SIGNING_PROFILE" `
          --alg SHA-256 `
          --tsaurl http://timestamp.acs.microsoft.com `
          --tsmode RFC3161 `
          "@$fileList"
        if($LASTEXITCODE -ne 0) { throw "jsign failed with exit code $LASTEXITCODE" }

    - name: Publish
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      shell: pwsh
      env:
        SECRET: ${{ secrets.GC_PSGALLERY_APIKEY }}
      run: |
        $modulePath = Join-Path $env:GITHUB_WORKSPACE 'Module' $env:MODULE_NAME
        Write-Host "Publishing from: $modulePath"
        try
        {
          #makes sure that mandatory PSResourceRepository.xml is created
          Get-PSResourceRepository | Out-Null
          $env:PSModulePath = $env:PSModulePath + [System.IO.Path]::PathSeparator + (Join-Path $env:GITHUB_WORKSPACE 'Module')
          "PSModulePath: $env:PSModulePath"
          Publish-PSResource -Path $modulePath -Repository PSGallery -ApiKey "$env:SECRET"
        }
        catch
        {
          Write-Host "Error: $($_.Exception)"
          throw
        }

    - name: Create Release
      id: create_release
      if: ${{ github.event_name != 'workflow_dispatch' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        draft: false
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: false
        name: Release ${{ github.ref_name }}
